baseURL: "https://slofgren.com/"
theme: "PaperMod"
title: "Sean Löfgren"
languageCode: en
DefaultContentLanguage: en
pagination:
  pagerSize: 3

# Enable taxonomies for tags
taxonomies:
  tag: tags

# Build settings
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

# Syntax highlighting with Chroma (server-side, no JS needed)
markup:
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false
    noClasses: false

# Output formats
outputs:
  home:
    - HTML
    - RSS
    - JSON  # For search

# Menu navigation
menu:
  main:
    - identifier: archive
      name: Archive
      url: /archives/
      weight: 10
    - identifier: cv
      name: CV
      url: /cv/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30

params:
  description: "Blog of Sean Löfgren"
  author: "Sean Löfgren"

  # Include both posts and TIL in main sections
  mainSections: ["posts", "til"]
  hideAuthor: true

  # Favicon
  favicon: /img/favicon.ico

  # Profile mode for homepage
  profileMode:
    enabled: true
    imageUrl: "/img/ava.webp"
    imageWidth: 150
    imageHeight: 150
  socialIcons:
    - name: github
      url: "https://github.com/SeanBE"
    - name: linkedin
      url: "https://linkedin.com/in/seanlofgren"
    - name: rss
      url: "/index.xml"

  # Theme settings
  defaultTheme: auto  # auto switches based on system preference
  disableThemeToggle: false

  # Show reading time
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true

  # Table of contents
  ShowToc: true
  TocOpen: false

  # Search
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

  # Cover image defaults
  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

# Analytics
googleAnalytics: "G-1B2Z059XVS"
